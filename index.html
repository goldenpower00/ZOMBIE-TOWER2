<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<meta name="description" content="Zombie Tower - Tugy &amp; Uugana's mini pixel game. Climb the tower one small step at a time.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b163d'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%238fcb7a'/%3E%3Crect x='4' y='6' width='3' height='1' fill='%231a1226'/%3E%3Crect x='9' y='6' width='3' height='1' fill='%231a1226'/%3E%3Crect x='6' y='10' width='4' height='1' fill='%231a1226'/%3E%3C/svg%3E">
<style>[hidden]{display:none!important} *,*::before,*::after{box-sizing:border-box} img{max-width:100%}</style>
<title>Zombie Tower</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: full-screen pixel canvas (low-res buffer scaled up). HUD drawn on canvas. Story, plan and ending are pixel-styled DOM cards over the game. Touch buttons in the corners. */
:root{
  color-scheme:dark;
  --ink:#0d0b1e; --panel:#1b163d; --panel2:#272056; --line:#4a3f94;
  --text:#f7f3ff; --muted:#bdb4e6;
  --sun:#ffd23f; --sun2:#c99a00; --hot:#ff5c8a; --mint:#6ee7a8; --sky:#6fb6ff; --bad:#ff4d6d;
  --px:'Press Start 2P','Courier New',monospace;
  --pb:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --tx:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{box-sizing:border-box;height:100%;overflow:hidden;overscroll-behavior:none}
body{height:100%;position:fixed;inset:0;width:100%;overscroll-behavior:none}
body{margin:0;background:var(--ink);color:var(--text);font:400 19px/1.5 var(--tx);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:var(--ink);overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
h1,h2{font-family:var(--px);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

#ov{position:absolute;inset:0;display:none;justify-content:center;align-items:flex-start;padding:16px;background:rgba(8,6,24,.74);overflow:auto;touch-action:pan-y}
#ov.on{display:flex}
.stack{display:grid;gap:18px;width:100%;max-width:640px;margin-block:auto}
.card{background:var(--panel);border:4px solid var(--line);box-shadow:0 6px 0 #05030f;padding:22px 20px;display:grid;gap:14px}
.eyebrow{font-family:var(--pb);font-weight:700;font-size:15px;letter-spacing:.12em;color:var(--hot)}
.card h1{font-size:clamp(1.7rem,7.5vw,2.7rem);color:var(--sun);text-shadow:4px 4px 0 #05030f}
.card h2{font-size:clamp(1rem,4.4vw,1.45rem);color:var(--sun);text-shadow:3px 3px 0 #05030f}
.lead{font-size:1.25rem}
.big{font-size:1.35rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.95rem;color:var(--muted)}
.btn{font-family:var(--pb);font-weight:700;font-size:21px;letter-spacing:.08em;min-height:56px;padding:12px 22px;background:var(--sun);color:#1b1300;border:4px solid #05030f;box-shadow:inset -4px -4px 0 var(--sun2),0 5px 0 #05030f;justify-self:start}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 var(--sun2),0 1px 0 #05030f}
.btn.alt{background:var(--panel2);color:var(--text);box-shadow:inset -4px -4px 0 #15103a,0 5px 0 #05030f}
.row{display:flex;gap:12px;flex-wrap:wrap}
.keys{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.keys li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.keys b{font-family:var(--pb);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--mint);min-width:5.5em}
.kbd{font-family:var(--pb);font-weight:700;font-size:15px;background:#05030f;border:2px solid var(--line);padding:4px 6px;color:var(--sun)}
.credit{font-family:var(--pb);font-weight:700;font-size:clamp(1.05rem,4.2vw,1.35rem);letter-spacing:.04em;color:var(--mint);border-left:6px solid var(--hot);padding-left:10px}
.logo{font-family:var(--px);font-size:clamp(2rem,10vw,3.6rem);line-height:1.1;color:var(--sun);text-shadow:4px 4px 0 var(--hot),8px 8px 0 #05030f}
.story{display:grid;gap:10px;font-size:1.25rem}
.story p{border-left:6px solid var(--line);padding-left:12px}
.story p.hl{border-color:var(--hot)}
.stop{font-family:var(--px);font-size:clamp(2rem,9vw,3rem);color:var(--bad);text-shadow:4px 4px 0 #05030f}
.counter{font-family:var(--pb);font-weight:700;font-size:clamp(1.4rem,6vw,1.9rem);color:var(--sun)}
.bar{height:18px;background:#05030f;border:3px solid var(--line)}
.bar i{display:block;height:100%;background:var(--bad)}

.plan{display:grid;gap:10px;justify-items:center;text-align:center}
.pl-label{font-family:var(--pb);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--mint)}
.bigbox{background:var(--hot);color:#2a0612;border:4px solid #05030f;padding:12px 16px;font-weight:700;font-size:1.15rem;max-width:30rem}
.arrow{font-family:var(--px);color:var(--sun);font-size:18px}
.floors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;max-width:30rem}
.floors span{background:var(--sky);color:#06142a;border:3px solid #05030f;font-family:var(--pb);font-weight:700;font-size:16px;padding:8px 0}
.dots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;width:100%;max-width:30rem}
.dots div{display:flex;justify-content:center;gap:4px}
.dots i{width:12px;height:12px;background:var(--sun);border:2px solid #05030f}
.rule{background:var(--panel2);border:3px solid var(--sun);padding:12px 14px;font-size:1.2rem;font-weight:700;text-align:center}
.rise{animation:pop .45s both;animation-delay:var(--d,0s)}
@keyframes pop{from{transform:translateY(10px) scale(.9);opacity:0}to{transform:none;opacity:1}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.stats div{background:var(--panel2);border:3px solid var(--line);padding:10px 4px;font-size:.95rem;color:var(--muted)}
.stats b{display:block;font-family:var(--pb);font-weight:700;font-size:1.5rem;color:var(--sun);margin-bottom:6px}
.then{display:grid;gap:8px}
.then div{display:grid;grid-template-columns:5.5rem 1fr;gap:10px;align-items:center;padding:10px 12px;border:3px solid}
.then b{font-family:var(--pb);font-weight:700;font-size:16px;letter-spacing:.06em}
.then .bad{border-color:var(--bad);background:#3a1426}
.then .bad b{color:var(--bad)}
.then .good{border-color:var(--mint);background:#123326}
.then .good b{color:var(--mint)}
.mini{display:grid;gap:4px;justify-items:center}
.mini div{display:flex;gap:6px;align-items:center}
.mini span{font-family:var(--pb);font-weight:700;font-size:14px;width:5em;text-align:right;color:var(--muted)}
.mini i{width:16px;height:16px;background:var(--sun);border:2px solid #05030f}

.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{min-height:64px;border:3px dashed var(--line);display:grid;place-items:center;text-align:center;padding:4px;font-family:var(--pb);font-weight:700;font-size:14px;color:var(--muted);line-height:1.3}
.slot.full{border-style:solid;border-color:var(--mint);background:#123326;color:var(--text)}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{display:grid;gap:4px;text-align:left;padding:12px;min-height:72px;background:var(--panel2);border:3px solid var(--line);border-bottom-width:7px}
.pc b{font-family:var(--pb);font-weight:700;font-size:17px;letter-spacing:.04em;color:var(--sun)}
.pc span{font-size:1.05rem}
.pc:disabled{opacity:.3;cursor:default}
.pc.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.5em;font-weight:700}
.fb.bad{color:var(--bad)} .fb.good{color:var(--mint)}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.loop span{font-family:var(--pb);font-weight:700;font-size:15px;padding:10px 8px;border:3px solid #05030f;color:#120d2a}
.loop .a{background:var(--hot)} .loop .b{background:var(--sky)} .loop .c{background:var(--sun)} .loop .d{background:var(--mint)}
.loop em{font-style:normal;font-family:var(--pb);font-weight:700;color:var(--sun);font-size:20px}
.simple{margin:0;padding-left:22px;display:grid;gap:6px;font-size:1.2rem}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs div{display:grid;gap:6px;padding:12px;border:3px solid}
.vs b{font-family:var(--pb);font-weight:700;font-size:16px;letter-spacing:.06em}
.vs span{font-size:1.2rem;font-weight:700}
.vs em{font-style:normal;color:var(--muted)}
.vs .school{border-color:var(--bad);background:#3a1426} .vs .school b{color:var(--bad)}
.vs .game{border-color:var(--mint);background:#123326} .vs .game b{color:var(--mint)}
.try{background:var(--panel2);border:3px solid var(--sky);padding:12px 14px;font-size:1.15rem}
.try b{font-family:var(--pb);font-weight:700;font-size:16px;color:var(--sky);margin-right:8px}
.res{border-left:6px solid var(--sun);padding-left:12px}
.src{font-size:.85rem;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.vs{grid-template-columns:1fr}.then div{grid-template-columns:1fr;gap:2px}.slot{font-size:12px}}

#touch{display:none}
#touch.on{display:block}
.tb{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:74px;height:74px;border-radius:12px;background:rgba(27,22,61,.55);border:3px solid rgba(255,255,255,.4);color:#fff;font-family:var(--pb);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0;touch-action:none}
.tb svg{width:30px;height:30px}
.tb.down{background:rgba(255,255,255,.35)}
#bL{left:14px} #bR{left:100px} #bS{right:100px} #bJ{right:14px;background:rgba(255,210,63,.4)}
#deck{display:none;position:absolute;left:0;right:0;bottom:0;height:calc(var(--ctrl) + env(safe-area-inset-bottom,0px));background:#120e2a;border-top:4px solid var(--line)}
body.portrait{--ctrl:148px}
body.portrait #deck{display:block}
body.portrait .tb{width:min(80px,21vw);height:min(80px,21vw);bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:15px}
body.portrait #bL{left:12px} body.portrait #bR{left:calc(20px + min(80px,21vw))} body.portrait #bS{right:calc(20px + min(80px,21vw))} body.portrait #bJ{right:12px}
body.portrait .tb svg{width:36px;height:36px}
.topbtns{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;gap:8px}
.ib{width:44px;height:44px;background:rgba(27,22,61,.85);border:3px solid var(--line);color:var(--text);display:grid;place-items:center;padding:0}
.ib svg{width:22px;height:22px}
#rot-unused{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:4px solid var(--sun);padding:14px 18px;font-family:var(--pb);font-weight:700;font-size:18px;line-height:1.6;text-align:center;color:var(--sun);max-width:80vw}
@media (prefers-reduced-motion:reduce){.rise,.pc.shake{animation:none}}
/* ---------- boss-fight prank ---------- */
.prank{border-color:var(--hot);animation:pkIn .35s both}
.prank.offer{animation:pkIn .35s both,rainbow .8s steps(4) infinite}
@keyframes rainbow{0%{border-color:#ff5c8a}25%{border-color:#ffd23f}50%{border-color:#6ee7a8}75%{border-color:#6fb6ff}}
@keyframes pkIn{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.pk-top{font-family:var(--pb);font-weight:700;letter-spacing:.12em;color:var(--sun);font-size:17px}
.pk-yes{font-size:22px;justify-self:stretch;animation:wob .6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
.pk-no{background:none;border:0;color:var(--muted);text-decoration:underline;justify-self:start;padding:6px 0;font-size:1rem}
.pk-time{display:grid;gap:6px;font-weight:700}
.picker{position:relative;display:grid;grid-template-columns:1.5fr auto 1fr;align-items:center;height:150px;background:#0d0b1e;border:3px solid var(--line)}
.wheel{box-sizing:border-box;height:150px;overflow-y:auto;scroll-snap-type:y mandatory;padding:50px 0;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.it{box-sizing:border-box;height:50px;display:grid;place-items:center;scroll-snap-align:center;font-family:var(--pb);font-weight:700;font-size:20px;color:#6a60a8;cursor:pointer}
.it.sel{color:var(--sun);font-size:24px}
.sep{font-family:var(--pb);font-weight:700;font-size:28px;color:var(--sun);padding:0 4px}
.hl{position:absolute;left:6px;right:6px;top:50px;height:50px;border-top:3px solid var(--sun);border-bottom:3px solid var(--sun);background:rgba(255,210,63,.06);pointer-events:none}
.pk-foods{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk-food{display:grid;justify-items:center;gap:4px;padding:14px 8px;background:var(--panel2);border:3px solid var(--line);border-bottom-width:7px;font-family:var(--pb);font-weight:700;font-size:19px;color:var(--text)}
.pk-food .em{font-size:34px;line-height:1}
.pk-food.nope{opacity:.45;text-decoration:line-through;border-color:var(--bad);cursor:default}
.pk-big{font-family:var(--px);font-size:clamp(1.5rem,7vw,2.5rem);line-height:1.3;color:var(--sun);text-shadow:4px 4px 0 var(--hot);animation:boing .6s both}
@keyframes boing{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:none}}
.prank.final{border-color:var(--sun)}
.pk-receipt{list-style:none;margin:0;padding:12px 14px;border:3px dashed var(--line);display:grid;gap:8px}
.pk-receipt li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pk-receipt b{color:var(--sun)}
.card.shake{animation:shake .35s}
@media (prefers-reduced-motion:reduce){.prank,.prank.offer,.pk-yes,.pk-big,.card.shake{animation:none}}

</style>

</head>
<body>
<div id="stage">
  <canvas id="c" aria-label="Zombie Tower game"></canvas>
  <div id="touch">
    <div id="deck"></div>
    <button class="tb" id="bL" aria-label="Move left"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 4v16L5 12z"/></svg></button>
    <button class="tb" id="bR" aria-label="Move right"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 4v16l10-8z"/></svg></button>
    <button class="tb" id="bS" aria-label="Shoot">SHOOT</button>
    <button class="tb" id="bJ" aria-label="Jump">JUMP</button>
  </div>
  <div class="topbtns">
    <button class="ib" id="btnFull" aria-label="Full screen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <button class="ib" id="btnSound" aria-label="Sound on or off"></button>
    <button class="ib" id="btnPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  </div>
  <div id="ov"></div>
</div>

<script>
(function(){
"use strict";
/* =====================================================================
   ✏️  EASY TO EDIT: the boss-fight prank. Change the text here.
   ===================================================================== */
const PRANK={
  on:true,               // false = turn the prank off
  startAfter:6,          // seconds into boss step 2 before the offer pops up
  offerSeconds:5,        // how long the "super power" offer stays
  friend:"Uugana",       // question 1 is about this person
  birthday:null,         // real birthday, e.g. {month:"March", day:2}. null = EVERY answer is wrong 😈
  startMonth:"February", // where the birthday wheel starts
  startDay:2,
  me:"Tugy",             // question 2 is about this person
  foods:[                // 4 answers for question 2 (all of them are wrong 😂)
    {name:"Tsuivan",     emoji:"🍲", reply:"❌ Tsuivan? Too easy. NOPE 🙄"},
    {name:"Ramen",       emoji:"🍜", reply:"❌ Ramen? Nah. 🍜💔"},
    {name:"Spaghetti",   emoji:"🍝", reply:"❌ Spaghetti?! Mamma mia... NO 🤌"},
    {name:"Samgyeopsal", emoji:"🥓", reply:"❌ Samgyeopsal? So close... just kidding, NO 😏"}
  ]
};
/* ===================================================================== */
/* ================= setup ================= */
const TS=16, GRAV=950, RUN=98, JUMP=332, SPRING=548, MAXFALL=420;
const $=id=>document.getElementById(id);
const cv=$("c"), ctx=cv.getContext("2d");
const buf=document.createElement("canvas"), bx=buf.getContext("2d");
let Wc=1024,Hc=640,DPR=1,Wd=1024,Hd=640,K=4,KI=4,VW=320,VH=180,U=1,PORT=false;
const buf2=document.createElement("canvas"), bx2=buf2.getContext("2d");
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), TAU=Math.PI*2;
const FB="'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif", FP="'Pixelify Sans','Trebuchet MS',sans-serif", FT="'Press Start 2P','Courier New',monospace";
function mk(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; }
let touchMode=false;

function resize(){
  const r=cv.getBoundingClientRect();
  Wc=Math.max(280,r.width||window.innerWidth||1024); Hc=Math.max(240,r.height||window.innerHeight||640);
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  Wd=Math.round(Wc*DPR); Hd=Math.round(Hc*DPR);
  cv.width=Wd; cv.height=Hd;
  PORT=touchMode && Hc>Wc;
  document.body.classList.toggle("portrait",PORT);
  if(PORT){ K=Math.max(1,Wd/228); }
  else {
    K=Math.max(1,Hd/(touchMode?285:252));
    if(Wd/K<260) K=Math.max(1,Wd/260);
    if(Wd/K>600) K=Wd/600;
  }
  VW=Math.ceil(Wd/K); VH=Math.ceil(Hd/K);
  KI=Math.max(1,Math.ceil(K));
  buf.width=VW; buf.height=VH; buf2.width=VW*KI; buf2.height=VH*KI;
  U=DPR*clamp(Math.min(Wc,Hc)/520,.8,1.35);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,250));
if(window.visualViewport) window.visualViewport.addEventListener("resize",resize);
const CTRL=148;
/* stop the page (and the page around it) from scrolling while playing */
document.addEventListener("touchmove",e=>{ if(!e.target.closest || !e.target.closest("#ov")) e.preventDefault(); },{passive:false});

/* ================= pixel sprites ================= */
function spr(rows,pal){
  const w=Math.max.apply(null,rows.map(r=>r.length)), h=rows.length, c=mk(w,h), x=c.getContext("2d");
  for(let y=0;y<h;y++){ const r=rows[y]; for(let i=0;i<w;i++){ const ch=r[i]; if(!ch||ch==="."||!pal[ch]) continue; x.fillStyle=pal[ch]; x.fillRect(i,y,1,1); } }
  return c;
}
function flipC(c){ const f=mk(c.width,c.height), x=f.getContext("2d"); x.translate(c.width,0); x.scale(-1,1); x.drawImage(c,0,0); return f; }
function silC(c,col){ const f=mk(c.width,c.height), x=f.getContext("2d"); x.drawImage(c,0,0); x.globalCompositeOperation="source-in"; x.fillStyle=col; x.fillRect(0,0,c.width,c.height); return f; }
function center(rows,w){ return rows.map(r=>{ const p=w-r.length, l=Math.floor(p/2); return ".".repeat(Math.max(0,l))+r+".".repeat(Math.max(0,p-l)); }); }
function pair(c){ const l=flipC(c); return {r:c,l:l,wr:silC(c,"#ffffff"),wl:silC(l,"#ffffff")}; }

let AC=null, master=null, musG=null, sfxG=null, soundOn=true;
function ensureAudio(){
  if(AC){ if(AC.state==="suspended") AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=soundOn?1:0; master.connect(AC.destination);
    musG=AC.createGain(); musG.gain.value=.55; musG.connect(master);
    sfxG=AC.createGain(); sfxG.gain.value=1; sfxG.connect(master);
  }catch(e){ AC=null; }
}
function toneAt(f,t,d,type,v,slide,dest){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"square"; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(dest||sfxG); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
function tone(f,t0,d,type,v,slide){ if(AC) toneAt(f,AC.currentTime+t0,d,type,v,slide); }

  mel:[74,0,74,77,76,0,74,72, 70,0,70,74,72,0,0,0, 72,0,72,76,74,0,72,70, 69,0,73,76,81,0,0,0]};

function startMusic(boss){ ensureAudio(); if(!AC) return; mus.song=boss?BSONG:SONG; mus.tempo=boss?160:132; mus.step=0; mus.next=AC.currentTime+.08; mus.on=true; }
function stopMusic(){ mus.on=false; }
setInterval(()=>{
  if(!AC||!mus.on) return;
  const spb=60/mus.tempo/2, S=mus.song;
  while(mus.next<AC.currentTime+.15){
    const s=mus.step, bar=Math.floor(s/8)%4, i=s%8, ch=S.chords[bar];
    if(i%2===0) toneAt(midi(S.bass[bar]+(i===4?12:0)),mus.next,spb*.9,"square",.035,0,musG);
    toneAt(midi(ch[[0,1,2,1,0,1,2,1][i]]+12),mus.next,spb*.7,"triangle",.03,0,musG);
    const m=S.mel[s%32]; if(m) toneAt(midi(m),mus.next,spb*1.6,"square",.018,0,musG);
    mus.next+=spb; mus.step++;
  }
},40);

function loadLevel(idx){
  const def=idx<0?COURT:FLOORS[idx];
  const rows=def.map, H=rows.length, W=Math.max.apply(null,rows.map(r=>r.length));
  L={idx:idx,def:def,W:W,H:H,pw:W*TS,ph:H*TS,grid:[],theme:THEMES[def.theme],gateOpen:false,switchOn:false,sw:null,door:null,flag:null,

  enemies=[]; shots=[]; eshots=[]; parts=[]; pops=[]; boss=null;
  for(let y=0;y<H;y++){
    L.grid[y]=[];
    for(let x=0;x<W;x++){
      const ch=rows[y][x]||"#", px=x*TS, py=y*TS; let g=".";
      if(ch==="#"||ch==="="||ch==="^"||ch==="G") g=ch;
      else if(ch==="P") L.start={x:px+3,y:py+2};
      else if(ch==="z") enemies.push(mkEnemy("walker",px,py));
      else if(ch==="j") enemies.push(mkEnemy("jumper",px,py));
      else if(ch==="s") enemies.push(mkEnemy("spitter",px,py));
      else if(ch==="b") enemies.push(mkEnemy("flyer",px,py));
      else if(ch==="k") L.keys.push({x:px+8,y:py+8,show:false,got:false,t:Math.random()*6});
      else if(ch==="f") L.flag={x:px,y:py,show:false};
      else if(ch==="Z") L.spawns.push({x:px,y:py});
      else if(ch==="w") L.sw={x:px,y:py,t:0};
      else if(ch==="D") L.door={x:px,y:py-TS,open:false};
      else if(ch==="o") L.stars.push({x:px+8,y:py+8,got:false,t:Math.random()*6});
      else if(ch==="h") L.hearts.push({x:px+8,y:py+8,got:false,t:Math.random()*6});
      else if(ch==="M") L.movers.push({x0:px,x:px,y:py,w:48,range:5*TS,per:3.8+L.movers.length*.7,ph:L.movers.length*1.3,dx:0});
      else if(ch==="S") L.springs.push({x:px,y:py,t:0});
      else if(ch==="X") L.bossAt={x:px,y:py};
      L.grid[y][x]=g;
    }
  }
  L.static=renderStatic();
  P=mkPlayer(L.start.x,L.start.y);
  G.cp={x:P.x,y:P.y};
  if(L.bossAt) boss=mkBoss(L.bossAt.x,L.bossAt.y);
  updCam(0,true);
}

/* ================= tiles & physics ================= */
function tileAt(tx,ty){ if(ty<0||tx<0||tx>=L.W) return "#"; if(ty>=L.H) return "."; return L.grid[ty][tx]; }
function isSolid(tx,ty){ const g=tileAt(tx,ty); return g==="#"||(g==="G"&&!L.gateOpen); }
function solidRect(x,y,w,h){
  const x0=Math.floor(x/TS), x1=Math.floor((x+w-.001)/TS), y0=Math.floor(y/TS), y1=Math.floor((y+h-.001)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(isSolid(tx,ty)) return true;
  return false;
}
function oneRow(x,w,ty){ const x0=Math.floor(x/TS), x1=Math.floor((x+w-.001)/TS); for(let tx=x0;tx<=x1;tx++) if(tileAt(tx,ty)==="=") return true; return false; }
function moveBody(e,dt,o){
  o=o||{}; e.onGround=false; e.hitWall=0;
  let dx=e.vx*dt, n=Math.max(1,Math.ceil(Math.abs(dx)/6)); const sx=dx/n;
  for(let i=0;i<n;i++){
    e.x+=sx;
    if(solidRect(e.x,e.y,e.w,e.h)){
      if(sx>0) e.x=Math.floor((e.x+e.w)/TS)*TS-e.w-.001; else e.x=(Math.floor(e.x/TS)+1)*TS+.001;
      e.hitWall=sx>0?1:-1; e.vx=0; break;
    }
  }
  const dy=e.vy*dt; n=Math.max(1,Math.ceil(Math.abs(dy)/6)); const sy=dy/n;
  for(let i=0;i<n;i++){
    const pb=e.y+e.h; e.y+=sy;
    if(sy>0){
      if(solidRect(e.x,e.y,e.w,e.h)){ e.y=Math.floor((e.y+e.h)/TS)*TS-e.h; e.vy=0; e.onGround=true; break; }
      if(!o.drop&&!o.noOne){
        const ty=Math.floor((e.y+e.h)/TS), top=ty*TS;
        if(pb<=top+.01 && e.y+e.h>=top && oneRow(e.x,e.w,ty)){ e.y=top-e.h; e.vy=0; e.onGround=true; break; }
      }
    } else if(sy<0 && solidRect(e.x,e.y,e.w,e.h)){ e.y=(Math.floor(e.y/TS)+1)*TS+.001; e.vy=0; break; }
  }
}
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function onOneWay(p){ const ty=Math.floor((p.y+p.h+1)/TS); return oneRow(p.x,p.w,ty) && !solidRect(p.x,p.y+2,p.w,p.h); }
function spikeHit(p){
  const x0=Math.floor(p.x/TS), x1=Math.floor((p.x+p.w)/TS), y0=Math.floor(p.y/TS), y1=Math.floor((p.y+p.h)/TS);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++) if(tileAt(tx,ty)==="^"){
    if(overlap(p,{x:tx*TS+2,y:ty*TS+9,w:12,h:7})) return true;
  }
  return false;
}
function nearSpike(p){ const ty=Math.floor((p.y+p.h-2)/TS); for(let tx=Math.floor(p.x/TS)-1;tx<=Math.floor((p.x+p.w)/TS)+1;tx++) if(tileAt(tx,ty)==="^") return true; return false; }

/* ================= effects ================= */
function puff(x,y,col,n,sp,g){ for(let i=0;i<n;i++){ const a=rnd(0,TAU), v=rnd(20,sp||90); parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(g?40:0),life:rnd(.3,.7),col:col,s:Math.random()<.3?2:1,g:g?300:0}); } }
function dust(x,y,n){ for(let i=0;i<n;i++) parts.push({x:x+rnd(-4,4),y:y,vx:rnd(-30,30),vy:rnd(-30,-5),life:rnd(.2,.4),col:"#d8d0f0",s:1,g:0}); }
function confetti(x,y){ const cols=["#ffd23f","#ff5c8a","#6ee7a8","#6fb6ff","#ffffff"]; for(let i=0;i<34;i++){ const a=rnd(-Math.PI*.9,-Math.PI*.1), v=rnd(80,200); parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.7,1.3),col:cols[i%5],s:2,g:320}); } }

/* ================= player ================= */
const keys={}, tch={l:false,r:false,j:false,s:false};
const inp={l:false,r:false,u:false,d:false,s:false};
let jumpPressed=false, shootPressed=false;
function syncInp(){
  inp.l=!!(keys.arrowleft||keys.a||tch.l); inp.r=!!(keys.arrowright||keys.d||tch.r);
  inp.u=!!(keys.arrowup||keys.w||keys[" "]||keys.z||tch.j); inp.d=!!(keys.arrowdown||keys.s);
  inp.s=!!(keys.x||keys.j||keys.k||tch.s);
}
function updPlayer(dt){
  const p=P;
  if(p.onMover){ const m=p.onMover; const ox=p.x; p.x+=m.dx; if(solidRect(p.x,p.y,p.w,p.h)) p.x=ox; }
  const dir=(inp.r?1:0)-(inp.l?1:0);
  if(dir) p.face=dir;
  const acc=p.onGround?1100:720, target=dir*RUN;
  if(p.knock>0) p.knock-=dt;
  else if(p.vx<target) p.vx=Math.min(target,p.vx+acc*dt); else if(p.vx>target) p.vx=Math.max(target,p.vx-acc*dt);
  p.coyote = p.onGround ? .09 : p.coyote-dt;
  p.jbuf = jumpPressed ? .12 : p.jbuf-dt;
  if(p.jbuf>0 && inp.d && p.onGround && onOneWay(p)){ p.drop=.22; p.jbuf=0; p.onGround=false; p.onMover=null; }
  else if(p.jbuf>0 && p.coyote>0){ p.vy=-JUMP; p.coyote=0; p.jbuf=0; p.cut=false; p.onGround=false; p.onMover=null; sfx.jump(); dust(p.x+5,p.y+p.h,5); }
  if(!inp.u && p.vy<0 && !p.cut){ p.vy*=.45; p.cut=true; }
  p.vy=Math.min(MAXFALL,p.vy+GRAV*dt*(p.vy>0?1.15:1));
  if(p.drop>0) p.drop-=dt;
  const wasG=p.onGround, vyBefore=p.vy, pb=p.y+p.h;
  moveBody(p,dt,{drop:p.drop>0});
  p.onMover=null;
  if(p.vy>=0 && p.drop<=0) for(const m of L.movers){
    if(p.x+p.w>m.x+1 && p.x<m.x+m.w-1 && pb<=m.y+1 && p.y+p.h>=m.y){ p.y=m.y-p.h; p.vy=0; p.onGround=true; p.onMover=m; break; }
  }
  if(p.onGround && !wasG && vyBefore>200) dust(p.x+5,p.y+p.h,4);
  for(const s of L.springs){
    if(p.vy>=0 && overlap(p,{x:s.x+2,y:s.y+8,w:12,h:8}) && p.y+p.h<=s.y+15){
      p.vy=-SPRING; p.cut=true; p.onGround=false; p.onMover=null; s.t=.25; sfx.spring(); dust(s.x+8,s.y+10,8);
    }
  }
  p.cd-=dt; p.shootT-=dt;
  if((shootPressed||inp.s) && p.cd<=0 && shots.length<4){
    shots.push({x:p.face>0?p.x+p.w+1:p.x-1,y:p.y+8,vx:p.face*250+p.vx*.3,life:.85});
    p.cd=.24; p.shootT=.08; sfx.shoot();
  }
  if(spikeHit(p)) hurtPlayer(1,"spike");
  else if(p.y>L.ph+30) hurtPlayer(1,"fall");
  if(p.onGround && !p.onMover && !nearSpike(p) && !solidRect(p.x,p.y,p.w,p.h)) p.lastSafe={x:p.x,y:p.y};
  p.inv-=dt;
  if(Math.abs(p.vx)>10 && p.onGround) p.anim+=dt;
}
function hurtPlayer(d,kind,src){
  const p=P;
  if(kind==="spike"||kind==="fall"){ p.x=p.lastSafe.x; p.y=p.lastSafe.y; p.vx=0; p.vy=0; puff(p.x+5,p.y+7,"#ffffff",10,80); }
  if(p.inv>0) return;
  if(G.mode==="bigfail") p.hp=Math.max(1,p.hp-d); else p.hp-=d;
  p.inv=1.1; shake(4); G.red=.3; sfx.hurt();
  if(src){ const dir=(p.x+5)<(src.x+src.w/2)?-1:1; p.vx=dir*150; p.vy=-170; p.knock=.18; p.onMover=null; }
  if(p.hp<=0) die();
}
function die(){
  if(G.mode!=="play") return;
  G.mode="dying"; G.dieT=.9; G.deaths++; sfx.die(); puff(P.x+5,P.y+7,"#ff7a2f",24,140,true); puff(P.x+5,P.y+7,"#ffffff",12,90);
}

/* ================= enemies ================= */
function edgeAhead(e){
  const fx=e.face>0?e.x+e.w+1:e.x-1, tx=Math.floor(fx/TS), ty=Math.floor((e.y+e.h+2)/TS), feet=Math.floor((e.y+e.h-2)/TS);
  const below=isSolid(tx,ty)||tileAt(tx,ty)==="=";
  return !below || tileAt(tx,feet)==="^" || tileAt(tx,ty)==="^";
}
function updEnemy(e,dt){
  if(e.dead) return;
  if(e.appear>0){ e.appear-=dt; if(Math.random()<.3) puff(e.x+5,e.y+7,"#b9ff9a",1,40); return; }
  e.anim+=dt; e.flash-=dt; e.kx*=Math.pow(.02,dt);
  const ex=e.x+e.w/2, ey=e.y+e.h/2, dxp=P.x+5-ex, dyp=P.y+7-ey;
  if(e.type==="walker"){
    if(e.chase && e.onGround && Math.abs(dxp)>6) e.face=Math.sign(dxp);
    e.vx=e.face*e.sp+e.kx; e.vy=Math.min(MAXFALL,e.vy+GRAV*dt);
    moveBody(e,dt,{});
    if(e.hitWall) e.face=-e.face; else if(e.onGround && !e.chase && edgeAhead(e)) e.face=-e.face;
  } else if(e.type==="jumper"){
    e.vy=Math.min(MAXFALL,e.vy+GRAV*dt);
    if(e.onGround){
      e.vx=e.kx; e.t-=dt;
      if(e.t<=0){
        if(Math.abs(dxp)<150 && Math.abs(dyp)<70){ e.face=Math.sign(dxp)||1; e.vx=e.face*70; e.vy=-260; }
        else { if(edgeAhead(e)||Math.random()<.3) e.face=-e.face; e.vx=e.face*40; e.vy=-170; }
        e.t=rnd(1,1.6);
      }
    }
    moveBody(e,dt,{});
    if(e.hitWall) e.face=-e.face;
  } else if(e.type==="spitter"){
    e.vy=Math.min(MAXFALL,e.vy+GRAV*dt); e.vx=e.kx; moveBody(e,dt,{});
    e.face=Math.sign(dxp)||e.face; e.t-=dt;
    if(e.t<=0 && Math.abs(dxp)<180 && Math.abs(dyp)<90){
      eshots.push({x:ex+e.face*6,y:e.y+3,vx:clamp(dxp/.9,-160,160),vy:-200,g:430,r:3,life:4});
      e.t=2.4; e.throwT=.3; tone(260,0,.1,"triangle",.04,-80);
    }
    if(e.throwT>0) e.throwT-=dt;
  } else if(e.type==="flyer"){
    e.ph+=dt;
    if(Math.abs(dxp)<170 && Math.abs(dyp)<130){ e.bx+=Math.sign(dxp)*30*dt; e.by+=Math.sign(dyp)*16*dt; e.face=Math.sign(dxp)||1; }
    e.bx+=e.kx*dt;
    e.bx=clamp(e.bx,TS,L.pw-TS-e.w); e.by=clamp(e.by,TS,L.ph-TS*2);
    e.x=e.bx; e.y=e.by+Math.sin(e.ph*3)*7;
  }
  if(G.mode!=="play"&&G.mode!=="bigfail") return;
  if(overlap(P,e)){
    if(P.vy>60 && (P.y+P.h-e.y)<9){ stompEnemy(e); }
    else hurtPlayer(1,"hit",e);
  }
}
function stompEnemy(e){
  damageEnemy(e,2,0); P.vy=inp.u?-350:-240; P.cut=!inp.u; G.hit=.05; sfx.stomp(); dust(P.x+5,P.y+P.h,6);
}
function damageEnemy(e,d,dir){
  if(e.dead||e.appear>0) return;
  e.hp-=d; e.flash=.12; e.kx=dir*80; sfx.hit(); puff(e.x+5,e.y+7,"#d8ffc0",3,60);
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  e.dead=true; G.kills++; sfx.kill(); G.hit=Math.max(G.hit,.03);
  const col=e.type==="flyer"?"#7a5cc4":(ZPAL[e.type]?ZPAL[e.type].g:"#8fcb7a");
  puff(e.x+5,e.y+7,col,14,120,true); puff(e.x+5,e.y+7,"#ffffff",6,80);
  pop(e.x+5,e.y-4,"Zzz..","#d8d0f0");
  if(G.mode==="bigfail"){ G.bigKills++; return; }
  const t=curTask(); if(t && t.t==="kill" && !t.done) t.count++;
}
function spawnTaskEnemies(t){
  const types=t.e||["walker"];
  for(let i=0;i<t.n;i++){
    const s=L.spawns[i%Math.max(1,L.spawns.length)]||{x:L.pw/2,y:L.ph-TS*2};
    const e=mkEnemy(types[i%types.length],s.x,s.y,.8+i*.15);

/* ================= boss ================= */
function updBoss(dt){
  const b=boss; if(!b) return;
  b.anim+=dt; b.flash-=dt;
  if(b.dead){
    b.deadT-=dt;
    if(Math.random()<.35){ puff(b.x+rnd(0,b.w),b.y+rnd(0,b.h),Math.random()<.5?"#ffd23f":"#ff5c8a",10,160,true); shake(3); }
    if(b.deadT<=0 && !b.fin){ b.fin=true; endGame(); }
    return;
  }
  b.vy=Math.min(MAXFALL,b.vy+GRAV*dt);
  const dir=Math.sign((P.x+5)-(b.x+b.w/2))||1;
  if(b.wait>0||b.stun>0){
    if(b.stun>0) b.stun-=dt; else b.wait-=dt;
    b.vx*=.85; moveBody(b,dt,{noOne:true}); return;
  }
  b.t-=dt;
  if(b.state==="walk"){
    b.face=dir; b.vx=dir*(30+b.step*12);
    if(b.t<=0){
      if(b.step>=3 && Math.random()<.45 && b.onGround){ b.state="crouch"; b.t=.55; }
      else { b.state="wind"; b.t=.6; }
    }
  } else if(b.state==="wind"){
    b.vx=0;
    if(b.t<=0){ bossThrow(); b.state="walk"; b.t=rnd(1.5,2.3)-b.step*.25; }
  } else if(b.state==="crouch"){
    b.vx=0;
    if(b.t<=0){ b.vy=-390; b.vx=dir*95; b.state="air"; b.air=true; sfx.roar(); }
  }
  moveBody(b,dt,{noOne:true});
  if(b.state==="air" && b.onGround){
    b.state="walk"; b.t=1.8; shake(8); sfx.boom(); dust(b.x+b.w/2,b.y+b.h,16);
    const gy=b.y+b.h-8;
    eshots.push({wave:true,x:b.x-4,y:gy,vx:-135,w:10,h:8,life:3});
    eshots.push({wave:true,x:b.x+b.w-6,y:gy,vx:135,w:10,h:8,life:3});
  }
  if(b.step>=2){
    b.sumT-=dt;
    if(b.sumT<=0){
      b.sumT=9; let fl=enemies.filter(e=>e.type==="flyer").length;
      for(let i=0;i<2&&fl<4;i++,fl++){ enemies.push(mkEnemy("flyer",rnd(3,L.W-4)*TS,TS*3,.7)); }
      sfx.appear();
    }
  }
  if(G.mode==="play" && overlap(P,b)){
    if(P.vy>60 && (P.y+P.h-b.y)<12){ damageBoss(3); P.vy=-340; P.cut=true; G.hit=.06; sfx.stomp(); }
    else hurtPlayer(1,"hit",b);
  }
}
function bossThrow(){
  const b=boss, n=2+b.step, mx=b.x+b.w/2, my=b.y+14;
  for(let i=0;i<n;i++) eshots.push({x:mx,y:my,vx:b.face*(45+i*48),vy:-250+i*18,g:430,r:3,life:4});
  tone(240,0,.15,"square",.05,-120);
}
function damageBoss(d){
  const b=boss; if(!b||b.dead||b.stun>0||b.wait>0) return;
  b.hp-=d; b.flash=.1; sfx.hit(); puff(b.x+b.w/2,b.y+20,"#ffffff",4,80);
  if(b.hp<=0){
    b.hp=0;
    const t=curTask(); if(t && t.t==="boss") t.count=1;
  }
}

/* ================= shots ================= */
function updShots(dt){
  for(const s of shots){
    s.x+=s.vx*dt; s.life-=dt;
    if(isSolid(Math.floor(s.x/TS),Math.floor(s.y/TS))){ s.life=0; puff(s.x,s.y,"#ffd23f",4,60); continue; }
    const r={x:s.x-2,y:s.y-2,w:4,h:4};
    for(const e of enemies){ if(!e.dead && e.appear<=0 && overlap(r,e)){ damageEnemy(e,1,Math.sign(s.vx)); s.life=0; break; } }
    if(s.life>0 && boss && !boss.dead && overlap(r,boss)){ if(boss.stun>0||boss.wait>0) puff(s.x,s.y,"#8fd3ff",3,50); else damageBoss(1); s.life=0; }
  }

}
function updEShots(dt){
  for(const e of eshots){
    e.life-=dt;
    if(e.wave){
      e.x+=e.vx*dt;
      if(isSolid(Math.floor((e.x+(e.vx>0?e.w:0))/TS),Math.floor((e.y+4)/TS))) e.life=0;
      if(Math.random()<.4) dust(e.x+5,e.y+8,1);
      if((G.mode==="play") && overlap(P,e)) { hurtPlayer(1,"hit",{x:e.x,y:e.y,w:e.w,h:e.h}); }
      continue;
    }
    e.vy+=e.g*dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
    if(isSolid(Math.floor(e.x/TS),Math.floor(e.y/TS))||e.y>L.ph){ e.life=0; puff(e.x,e.y,"#ff9fc0",5,60); continue; }
    if(G.mode==="play" && overlap(P,{x:e.x-3,y:e.y-3,w:6,h:6})){ e.life=0; hurtPlayer(1,"hit",{x:e.x,y:e.y,w:1,h:1}); }
  }
  eshots=eshots.filter(e=>e.life>0);
}

/* ================= pickups & tasks ================= */
function nearP(o,r){ return Math.abs(P.x+5-o.x)<r && Math.abs(P.y+7-o.y)<r+3; }
function updPickups(dt){
  for(const s of L.stars){ s.t+=dt; if(!s.got && nearP(s,9)){ s.got=true; G.stars++; sfx.star(); pop(s.x,s.y-8,"+1","#ffd23f"); puff(s.x,s.y,"#ffd23f",6,60); } }
  for(const h of L.hearts){ h.t+=dt; if(!h.got && P.hp<P.max && nearP(h,9)){ h.got=true; P.hp++; sfx.heart(); pop(h.x,h.y-8,"+1","#ff8fa3"); puff(h.x,h.y,"#ff4d6d",8,60); } }
  for(const k of L.keys){ k.t+=dt; if(k.show && !k.got && nearP(k,11)){ k.got=true; sfx.key(); pop(k.x,k.y-10,"KEY!","#ffd23f"); puff(k.x,k.y,"#ffd23f",12,90); const t=curTask(); if(t&&t.t==="key") t.count++; } }
  if(L.flag && L.flag.show && overlap(P,{x:L.flag.x,y:L.flag.y-14,w:16,h:30})) L.flagReached=true;
  if(L.sw && !L.switchOn && overlap(P,{x:L.sw.x+2,y:L.sw.y+4,w:12,h:12})) flipSwitch();
  if(L.door && L.door.open && overlap(P,{x:L.door.x+3,y:L.door.y+8,w:10,h:24})) L.doorReached=true;
}
function flipSwitch(){
  L.switchOn=true; L.gateOpen=true; sfx.sw(); shake(5); puff(L.sw.x+8,L.sw.y+8,"#6ee7a8",12,90);
  for(let ty=0;ty<L.H;ty++) for(let tx=0;tx<L.W;tx++) if(L.grid[ty][tx]==="G") puff(tx*TS+8,ty*TS+8,"#c0c0d8",4,60);
  if(curTask() && curTask().t!=="switch") say("The gate is open!",3);
}
function curTask(){ return L && L.tasks[L.ti]; }
function taskDone(t){
  if(t.t==="key") return L.keys.length>0 && L.keys.every(k=>k.got);
  if(t.t==="kill") return t.count>=t.n;
  if(t.t==="switch") return L.switchOn;
  if(t.t==="flag") return L.flagReached;
  if(t.t==="door") return L.doorReached;
  if(t.t==="boss") return t.count>0;
  return false;
}
function activateTask(i){
  const t=L.tasks[i]; if(!t) return;
  t.count=0;
  if(t.t==="key"){ for(const k of L.keys){ k.show=true; puff(k.x,k.y,"#ffd23f",10,70); } sfx.appear(); }
  else if(t.t==="flag"){ L.flag.show=true; puff(L.flag.x+8,L.flag.y,"#6ee7a8",10,70); }
  else if(t.t==="kill") spawnTaskEnemies(t);
  else if(t.t==="door"){ L.door.open=true; puff(L.door.x+8,L.door.y+16,"#ffd23f",14,80); }
  else if(t.t==="boss"){
    boss.step=t.step; boss.max=BOSS_HP[t.step-1]; boss.hp=boss.max; boss.state="walk"; boss.t=1.2;
    if(t.step===1){ boss.wait=1.6; sfx.roar(); }
  }
  say(touchMode&&t.sayT?t.sayT:t.say,4.5);
}
function checkTask(){
  const t=curTask(); if(!t||t.done) return;
  if(taskDone(t)) completeTask();
}
function setCheckpoint(){ G.cp=(P.onGround&&!P.onMover)?{x:P.x,y:P.y}:{x:P.lastSafe.x,y:P.lastSafe.y}; }
function completeTask(){
  const t=curTask(); t.done=true; G.wins++;
  setCheckpoint(); confetti(P.x+5,P.y);
  if(t.t==="door"){ floorDone(); return; }
  if(t.t==="boss" && t.step===3){ bossDefeated(); return; }
  sfx.win();
  if(t.t==="boss"){
    boss.stun=2.4; boss.vx=0; eshots=[]; shake(6);
    L.hearts.push({x:L.pw/2,y:6*TS+8,got:false,t:0});
  }
  L.ti++;
  const nt=L.tasks[L.ti];

/* ================= camera & update ================= */
function updCam(dt,snap){
  const hud=G&&(G.mode==="play"||G.mode==="dying"||G.mode==="won"||G.mode==="bigfail"||G.mode==="pause"||G.mode==="dead");
  const top=hud?Math.min(PORT?130:64,(G.tbBottom||0)/K):0, right=hud&&G.mode!=="bigfail"?(76*U)/K:0;
  const bottom=hud&&touchMode?(PORT?(CTRL+6)*DPR/K:Math.min(80,(100*DPR)/K)):0;
  const avail=VH-top-bottom;
  let tx=P.x+5-VW/2+P.face*18, ty=P.y+7-(top+avail/2)+6;
  tx = L.pw+right<=VW ? (L.pw-(VW-right))/2 : clamp(tx,0,L.pw-VW+right);
  ty = L.ph<=avail ? -(top+(avail-L.ph)/2) : clamp(ty,-top,L.ph-VH+bottom);
  if(snap){ cam.x=tx; cam.y=ty; return; }
  const k=Math.min(1,dt*6); cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*Math.min(1,dt*5);
}
function updParts(dt){
  for(const p of parts){ p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=Math.pow(.2,dt); if(!p.g) p.vy*=Math.pow(.2,dt); p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const q of pops){ q.y-=22*dt; q.life-=dt; }
  pops=pops.filter(q=>q.life>0);
}
function timers(dt){
  if(G.say){ G.say.t-=dt; if(G.say.t<=0) G.say=null; }
  if(G.banner){ G.banner.t-=dt; if(G.banner.t<=0) G.banner=null; }
  G.shake=Math.max(0,G.shake-dt*24); G.red=Math.max(0,G.red-dt);
  shk.x=Math.round((Math.random()-.5)*G.shake); shk.y=Math.round((Math.random()-.5)*G.shake);
}
function update(dt){
  const m=G.mode;
  if(m==="climb"){ G.climb.t+=dt; updParts(dt); timers(dt); if(G.climb.t>3.4) finishClimb(); return; }
  if(!(m==="play"||m==="bigfail"||m==="dying"||m==="won")){ updParts(dt); timers(dt); if(L) for(const mv of L.movers) updMover(mv,dt); return; }
  if(G.slow>0){ G.slow-=dt; dt*=.4; }
  timers(dt);
  if(G.hit>0){ G.hit-=dt; updParts(dt); return; }
  G.time+=dt; L.t+=dt;
  for(const mv of L.movers) updMover(mv,dt);
  if(m!=="dying") updPlayer(dt);
  for(const e of enemies) updEnemy(e,dt);
  enemies=enemies.filter(e=>!e.dead);
  if(boss) updBoss(dt);
  updShots(dt); updEShots(dt);
  if(m!=="dying") updPickups(dt);
  for(const s of L.springs) s.t-=dt;
  if(L.sw) L.sw.t+=dt;
  if(m==="bigfail") updBigFail(dt);
  if(G.mode==="play") checkTask();
  if(G.prankAt>0 && G.mode==="play" && L.def.roof && boss && !boss.dead){ G.prankAt-=dt; if(G.prankAt<=0) openPrank(); }
  if(m==="dying"){ G.dieT-=dt; if(G.dieT<=0) showDead(); }
  updParts(dt); updCam(dt);
}
function updMover(m,dt){ m.ph+=dt; const nx=m.x0+m.range*(.5-.5*Math.cos(m.ph*TAU/m.per)); m.dx=nx-m.x; m.x=nx; }

/* ================= static level art ================= */
function renderStatic(){
  const th=L.theme, c=mk(L.pw,L.ph), x=c.getContext("2d"), g=L.grid;
  const sol=(tx,ty)=>tx<0||tx>=L.W||ty<0||ty>=L.H||g[ty][tx]==="#";
  const empty=(tx,ty)=>tx>0&&tx<L.W-1&&ty>0&&ty<L.H-1&&g[ty][tx]===".";
  if(!th.sky){
    for(let ty=0;ty<L.H;ty++) for(let tx=0;tx<L.W;tx++){
      const px=tx*TS, py=ty*TS;
      x.fillStyle=th.bg; x.fillRect(px,py,TS,TS);
      x.fillStyle=th.bg2; x.fillRect(px,py+7,TS,1); x.fillRect(px,py+15,TS,1);
      const o=(ty%2)?4:12; x.fillRect(px+o,py,1,7); x.fillRect(px+((o+8)%16),py+8,1,7);
    }
    for(let ty=1;ty<L.H-2;ty++) for(let tx=1;tx<L.W-2;tx++){
      if((tx*7+ty*13)%37!==0||tx%3!==1) continue;
      if(!(empty(tx,ty)&&empty(tx+1,ty)&&empty(tx,ty+1)&&empty(tx+1,ty+1))) continue;
      const px=tx*TS, py=ty*TS;
      x.fillStyle=th.wall2; x.fillRect(px+4,py+3,24,27);
      x.fillStyle="#0a0d2a"; x.fillRect(px+6,py+6,20,22); x.fillRect(px+8,py+5,16,1);
      x.fillStyle="#ffffff"; x.fillRect(px+9,py+9,1,1); x.fillRect(px+20,py+12,1,1); x.fillRect(px+12,py+22,1,1);
      if((tx+ty)%3===0){ x.fillStyle=th.win; x.fillRect(px+18,py+8,5,5); x.fillStyle="#0a0d2a"; x.fillRect(px+20,py+8,3,3); }
      x.fillStyle=th.wall2; x.fillRect(px+15,py+5,2,23); x.fillRect(px+6,py+16,20,2);
      x.fillStyle=th.top; x.fillRect(px+3,py+30,26,2);
    }
  }
  for(let ty=0;ty<L.H;ty++) for(let tx=0;tx<L.W;tx++){
    const px=tx*TS, py=ty*TS, t=g[ty][tx];
    if(t==="#"){
      if(th.sky && ty===0) continue;
      x.fillStyle=th.wall; x.fillRect(px,py,TS,TS);
      x.fillStyle=th.wall2; x.fillRect(px,py+7,TS,1); x.fillRect(px,py+15,TS,1);
      const o=((tx+ty)%2)?3:11; x.fillRect(px+o,py,1,7); x.fillRect(px+((o+8)%16),py+8,1,7);
      if(!sol(tx,ty-1)||(th.sky&&ty===1)){ x.fillStyle=th.top; x.fillRect(px,py,TS,2); x.fillStyle=th.wall2; x.fillRect(px,py+2,TS,1); }
      if(!sol(tx,ty+1)){ x.fillStyle="rgba(0,0,0,.35)"; x.fillRect(px,py+TS-2,TS,2); }
      if(!sol(tx-1,ty)){ x.fillStyle="rgba(255,255,255,.1)"; x.fillRect(px,py,1,TS); }
      if(!sol(tx+1,ty)){ x.fillStyle="rgba(0,0,0,.25)"; x.fillRect(px+TS-1,py,1,TS); }
      if((tx*31+ty*17)%5===0){ x.fillStyle="rgba(255,255,255,.12)"; x.fillRect(px+5,py+3,2,1); }
    } else if(t==="="){
      x.fillStyle="#6b4424"; x.fillRect(px,py,TS,6);
      x.fillStyle="#b8814f"; x.fillRect(px,py,TS,4);
      x.fillStyle="#e2b47a"; x.fillRect(px,py,TS,1);
      x.fillStyle="#6b4424"; x.fillRect(px+7,py+1,1,3);
      x.fillStyle="#3a2a1a";
      if(g[ty][tx-1]!=="=") x.fillRect(px+1,py+6,2,4);
      if(g[ty][tx+1]!=="=") x.fillRect(px+13,py+6,2,4);
    } else if(t==="^"){
      x.fillStyle="#4a4a68"; x.fillRect(px,py+14,TS,2);
      const W_=[1,1,2,2,4,4], O_=[1,1,1,1,0,0];
      for(let i=0;i<4;i++) for(let j=0;j<6;j++){ x.fillStyle=j<2?"#ffffff":"#c8c8e6"; x.fillRect(px+i*4+O_[j],py+8+j,W_[j],1); x.fillStyle="#8a8aa8"; if(j>=2) x.fillRect(px+i*4+O_[j]+W_[j]-1,py+8+j,1,1); }
    }
  }
  return c;
}

let last=0, acc=0;
function frame(ts){
  const d=Math.min(.1,(ts-last)/1000||0); last=ts; acc+=d; let n=0;
  while(acc>=1/60 && n<6){ update(1/60); jumpPressed=false; shootPressed=false; acc-=1/60; n++; }
  if(n>=6) acc=0;
  render(); requestAnimationFrame(frame);
}

function skipStep(){

const PZ=[{t:"BIG GOAL",s:"Go to the top."},{t:"SMALL GOAL",s:"Beat this floor."},{t:"SMALL SUCCESS",s:"Small win! I did it!"},{t:"NEXT GOAL",s:"Now the next step!"}];
const PZ_HINT=["Start with the BIG goal.","Now make it small.","You did it! What do you get?","After a win... what comes next?"];
function setupPuzzle(){
  let order=[0,1,2,3];
  do{ for(let i=3;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } } while(order.join()==="0,1,2,3");
  let pos=0, tries=0;
  const slots=$("slots"), cards=$("pcards"), fb=$("pfb");
  slots.innerHTML=[0,1,2,3].map(i=>'<div class="slot" id="sl'+i+'">'+(i+1)+'</div>').join("");
  cards.innerHTML=order.map(id=>'<button class="pc" data-pz="'+id+'"><b>'+PZ[id].t+'</b><span>'+PZ[id].s+'</span></button>').join("");
  cards.addEventListener("click",e=>{
    const btn=e.target.closest("[data-pz]"); if(!btn||btn.disabled) return;
    const id=+btn.dataset.pz;
    if(id===pos){
      btn.disabled=true; const sl=$("sl"+pos); sl.textContent=PZ[id].t; sl.classList.add("full"); pos++; sfx.star();
      fb.className="fb good"; fb.textContent=pos<4?"Yes! Now step "+(pos+1)+".":"PERFECT! That is the big idea!";
      if(pos===4){ sfx.win(); const idea=$("idea"); idea.hidden=false; setTimeout(()=>{ try{ idea.scrollIntoView({behavior:"smooth",block:"start"}); }catch(er){} },250); }
    } else {
      tries++; sfx.bad(); btn.classList.remove("shake"); void btn.offsetWidth; btn.classList.add("shake");
      fb.className="fb bad"; fb.textContent="Not this one. Hint: "+PZ_HINT[pos];
    }
  });
}

function prankQ1(){
  clearInterval(prankTimer);
  const mi=Math.max(0,MONTHS.indexOf(PRANK.startMonth)), di=clamp(PRANK.startDay|0,1,31)-1;
  let days=""; for(let d=1;d<=31;d++) days+='<div class="it" data-i="'+(d-1)+'">'+String(d).padStart(2,"0")+'</div>';

    '<div class="pk-top">🔐 SECURITY QUESTION</div>'+
    '<p class="lead">To unlock SUPER POWER, answer this:</p>'+

    '<div class="picker"><div class="wheel" id="wm">'+MONTHS.map((m,i)=>'<div class="it" data-i="'+i+'">'+m+'</div>').join("")+'</div>'+
    '<div class="sep">|</div><div class="wheel" id="wd">'+days+'</div><div class="hl"></div></div>'+
    '<p class="small">Scroll up and down to pick the month and the day 👆👇</p>'+
    '<div class="row"><button class="btn" id="pkCheck" data-act="pk-check" hidden>CHECK ✅</button>'+
    '<button class="btn alt" data-act="pk-idk" data-focus>🤷 I don\'t know</button></div>'+

  const wm=$("wm"), wd=$("wd");

    for(const w of [wm,wd]){
      w.addEventListener("scroll",()=>{ mark(w); touched(); },{passive:true});
      w.addEventListener("click",e=>{ const it=e.target.closest(".it"); if(it){ w.scrollTo({top:+it.dataset.i*50,behavior:"smooth"}); touched(); } });

function pkCheck(){
  if(pk.locked) return;
  const m=clamp(Math.round($("wm").scrollTop/50),0,11), d=clamp(Math.round($("wd").scrollTop/50)+1,1,31), B=PRANK.birthday;

                       : "🤷 Still no idea? "+PRANK.friend+" is crying right now 😭");

function pkWrong(msg){
  pk.wrong++; sfx.bad(); pkShake();

    pk.locked=true; ov.querySelectorAll("#pkCard button").forEach(b=>b.disabled=true);

function prankQ2(){

ov.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  ensureAudio(); sfx.ui();
  const a=el.dataset.act;
  if(a==="full"){ toggleFull(); return; }
  if(a==="story") showStory();
  else if(a==="bigfail") startBigFail();
  else if(a==="plan") showPlan();
  else if(a==="floors") startFloors();
  else if(a==="respawn") respawn();
  else if(a==="resume") resumeGame();
  else if(a==="skip") skipStep();
  else if(a==="again"){ newG(); loadLevel(-1); showStory(); }
  else if(a==="pk-yes") prankQ1();
  else if(a==="pk-no") prankEnd("OK, STRONG GUY 💪","Good luck then 🙂");
  else if(a==="pk-check") pkCheck();
  else if(a==="pk-idk") pkIdk();

/* ================= input ================= */
window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  const playing=G && (G.mode==="play"||G.mode==="bigfail"||G.mode==="won");
  if(playing && ["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k)) e.preventDefault();
  if(G && G.mode==="climb" && (k===" "||k==="enter"||k==="x")){ e.preventDefault(); skipClimb(); }
  keys[k]=true; syncInp();
  if(e.repeat) return;
  if(playing){
    if(k===" "||k==="arrowup"||k==="w"||k==="z") jumpPressed=true;
    if(k==="x"||k==="j"||k==="k") shootPressed=true;
    if(k==="p"||k==="escape") pauseGame();
  } else if(G && G.mode==="pause" && (k==="p"||k==="escape")) resumeGame();
  if(k==="m") setSound(!soundOn);
});
window.addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; syncInp(); });
window.addEventListener("blur",()=>{ for(const k in keys) keys[k]=false; tch.l=tch.r=tch.j=tch.s=false; syncInp(); });
function enableTouch(){ if(touchMode) return; touchMode=true; $("touch").classList.add("on"); resize(); if(G&&G.mode==="title") showTitle(); }
try{ if(window.matchMedia && window.matchMedia("(pointer:coarse)").matches) enableTouch(); }catch(e){}
document.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch") enableTouch(); },true);
function bindTouch(id,key,onPress){
  const el=$(id);
  const down=e=>{ e.preventDefault(); ensureAudio(); tch[key]=true; el.classList.add("down"); if(onPress) onPress(); syncInp(); try{ el.setPointerCapture(e.pointerId); }catch(er){} };
  const up=e=>{ tch[key]=false; el.classList.remove("down"); syncInp(); };
  el.addEventListener("pointerdown",down); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up); el.addEventListener("lostpointercapture",up);
  el.addEventListener("contextmenu",e=>e.preventDefault());
}
bindTouch("bL","l"); bindTouch("bR","r");
bindTouch("bJ","j",()=>{ if(G.mode==="climb") skipClimb(); else jumpPressed=true; });
bindTouch("bS","s",()=>{ shootPressed=true; });
cv.addEventListener("pointerdown",()=>{ if(G.mode==="climb") skipClimb(); });
$("btnSound").addEventListener("click",()=>{ ensureAudio(); setSound(!soundOn); });
const fsEl=document.documentElement;
const fsOK=!!(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen) && (document.fullscreenEnabled||document.webkitFullscreenEnabled);
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function toggleFull(){
  try{
    if(isFull()){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { const r=(fsEl.requestFullscreen||fsEl.webkitRequestFullscreen).call(fsEl); if(r&&r.catch) r.catch(()=>{}); }
  }catch(e){}
}
if(fsOK){ $("btnFull").hidden=false; $("btnFull").addEventListener("click",()=>{ ensureAudio(); toggleFull(); }); }
document.addEventListener("fullscreenchange",()=>setTimeout(resize,120));
document.addEventListener("webkitfullscreenchange",()=>setTimeout(resize,120));
$("btnPause").addEventListener("click",()=>{ if(G.mode==="pause") resumeGame(); else pauseGame(); });
